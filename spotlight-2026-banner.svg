<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Background -->
  <rect width="1200" height="400" fill="#FAF9F5"/>

  <!-- ===== LEFT HALF: 2x2 QUADRANT GRID ===== -->
  <!-- Grid origin: x=40, y=40, quadrant size 260x150, gap 20 -->

  <!-- Quadrant 1: Top-Left — Lime — Sonne + Solarpanel -->
  <g>
    <rect x="40" y="40" width="260" height="150" fill="#AFF573"/>
    <!-- Sun -->
    <g stroke="#0A0A0F" stroke-width="2.5" fill="none" stroke-linecap="round">
      <circle cx="105" cy="95" r="16" fill="none"/>
      <line x1="105" y1="65" x2="105" y2="75"/>
      <line x1="105" y1="115" x2="105" y2="125"/>
      <line x1="75" y1="95" x2="85" y2="95"/>
      <line x1="125" y1="95" x2="135" y2="95"/>
      <line x1="84" y1="74" x2="91" y2="81"/>
      <line x1="119" y1="109" x2="126" y2="116"/>
      <line x1="84" y1="116" x2="91" y2="109"/>
      <line x1="119" y1="81" x2="126" y2="74"/>
    </g>
    <!-- Solar panel -->
    <g stroke="#0A0A0F" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <polygon points="160,140 240,140 250,105 170,105"/>
      <line x1="183" y1="105" x2="177" y2="140"/>
      <line x1="207" y1="105" x2="207" y2="140"/>
      <line x1="231" y1="105" x2="237" y2="140"/>
      <line x1="167" y1="123" x2="246" y2="123"/>
    </g>
    <!-- Label -->
    <text x="170" y="178" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#0A0A0F" text-anchor="middle">ERNEUERBARE SKALIEREN</text>
  </g>

  <!-- Quadrant 2: Top-Right — Pink — Batterie + Verbindungslinien -->
  <g>
    <rect x="320" y="40" width="260" height="150" fill="#FF8FA0"/>
    <!-- Battery -->
    <g stroke="#0A0A0F" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="370" y="75" width="70" height="45" rx="3"/>
      <rect x="440" y="88" width="6" height="19"/>
      <!-- Lightning bolt inside -->
      <polyline points="400,85 390,100 405,100 397,115" stroke-width="2.5" fill="none"/>
    </g>
    <!-- Smart-grid nodes & connection lines -->
    <g stroke="#0A0A0F" stroke-width="2.5" fill="#0A0A0F">
      <circle cx="470" cy="60" r="4"/>
      <circle cx="510" cy="95" r="4"/>
      <circle cx="470" cy="135" r="4"/>
      <circle cx="530" cy="140" r="4"/>
      <circle cx="535" cy="65" r="4"/>
    </g>
    <g stroke="#0A0A0F" stroke-width="2" fill="none">
      <line x1="440" y1="85" x2="470" y2="60"/>
      <line x1="440" y1="98" x2="510" y2="95"/>
      <line x1="440" y1="115" x2="470" y2="135"/>
      <line x1="470" y1="60" x2="535" y2="65"/>
      <line x1="510" y1="95" x2="535" y2="65"/>
      <line x1="510" y1="95" x2="530" y2="140"/>
      <line x1="470" y1="135" x2="530" y2="140"/>
    </g>
    <!-- Label -->
    <text x="450" y="178" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#0A0A0F" text-anchor="middle">SPEICHER &amp; SMARTE NETZE</text>
  </g>

  <!-- Quadrant 3: Bottom-Left — Cyan — Haus mit Wärme-Strahlen -->
  <g>
    <rect x="40" y="210" width="260" height="150" fill="#8CD7F5"/>
    <!-- House -->
    <g stroke="#0A0A0F" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="135,245 95,275 95,325 175,325 175,275"/>
      <rect x="125" y="295" width="20" height="30"/>
      <line x1="95" y1="275" x2="175" y2="275"/>
    </g>
    <!-- Heat waves to the right -->
    <g stroke="#0A0A0F" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 195,265 q 8,-8 16,0 q 8,8 16,0"/>
      <path d="M 195,290 q 8,-8 16,0 q 8,8 16,0"/>
      <path d="M 195,315 q 8,-8 16,0 q 8,8 16,0"/>
      <path d="M 245,265 q 8,-8 16,0 q 8,8 16,0"/>
      <path d="M 245,290 q 8,-8 16,0 q 8,8 16,0"/>
      <path d="M 245,315 q 8,-8 16,0 q 8,8 16,0"/>
    </g>
    <!-- Label -->
    <text x="170" y="348" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#0A0A0F" text-anchor="middle">EFFIZIENZ IM BESTAND</text>
  </g>

  <!-- Quadrant 4: Bottom-Right — Peach — Personen-Kreis -->
  <g>
    <rect x="320" y="210" width="260" height="150" fill="#F5C387"/>
    <!-- Five people arranged in a circle around center (450, 285) -->
    <g stroke="#0A0A0F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Person top -->
      <circle cx="450" cy="245" r="7"/>
      <path d="M 440,275 q 10,-15 20,0"/>
      <!-- Person top-right -->
      <circle cx="495" cy="265" r="7"/>
      <path d="M 485,295 q 10,-15 20,0"/>
      <!-- Person bottom-right -->
      <circle cx="478" cy="315" r="7"/>
      <path d="M 468,343 q 10,-13 20,0"/>
      <!-- Person bottom-left -->
      <circle cx="422" cy="315" r="7"/>
      <path d="M 412,343 q 10,-13 20,0"/>
      <!-- Person top-left -->
      <circle cx="405" cy="265" r="7"/>
      <path d="M 395,295 q 10,-15 20,0"/>
      <!-- Connecting circle (dashed) -->
      <circle cx="450" cy="290" r="48" stroke-dasharray="4 4"/>
    </g>
    <!-- Label -->
    <text x="450" y="348" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#0A0A0F" text-anchor="middle">BÜRGERENERGIE &amp; TEILHABE</text>
  </g>

  <!-- ===== RIGHT HALF: TEXT ===== -->
  <text x="620" y="180" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="48" fill="#0A0A0F">SPOTLIGHT 2026</text>
  <text x="620" y="222" font-family="Arial, sans-serif" font-size="22" fill="#1A1A20">Energie-Innovation für die Schweiz</text>
  <text x="620" y="258" font-family="Arial, sans-serif" font-size="14" fill="#6B6B70">Bis 30. Juni einreichen · spotlight.climanow.ch</text>
</svg>
